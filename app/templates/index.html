<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career Radar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #EDF1F4;
      --surface: #FFFFFF;
      --ink: #16212C;
      --muted: #5F6C78;
      --line: #D3DBE2;
      --signal: #0B7A75;
      --signal-soft: #D9EFEC;
      --radius: 10px;
      --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E1620;
        --surface: #15202B;
        --ink: #E3E9EF;
        --muted: #8C9AA8;
        --line: #243241;
        --signal: #43C7BE;
        --signal-soft: #13302F;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 15px/1.55 var(--font);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    /* ---------- шапка ---------- */

    .top h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 52px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .lede {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0 32px;
      color: var(--muted);
      font-size: 16px;
    }

    .lede::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 0 4px var(--signal-soft);
      flex: none;
    }

    .lede a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .lede a:hover { color: var(--signal); }

    .lede a:focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 2px;
    }

    /* ---------- форма ---------- */

    .filters { margin-bottom: 28px; }

    .filters input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font: inherit;
    }

    .filters input::placeholder { color: var(--muted); }

    .filters input:focus-visible,
    button:focus-visible,
    .job-title:focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 2px;
    }

    .filters .search {
      padding: 16px 18px;
      font-size: 20px;
      font-weight: 500;
      border-width: 2px;
      border-color: var(--ink);
    }

    .row {
      display: grid;
      grid-template-columns: 1.2fr 1.2fr 1fr auto auto;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      padding: 10px 18px;
      border: 1px solid var(--ink);
      border-radius: var(--radius);
      background: var(--ink);
      color: var(--bg);
      font: 500 15px/1.2 var(--font);
      cursor: pointer;
      white-space: nowrap;
    }

    button.ghost {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
    }

    .hint {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 6px 16px;
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 13px;
    }

    kbd {
      padding: 0 5px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
    }

    .indicator {
      color: var(--signal);
      font-weight: 500;
      visibility: hidden;
    }

    .indicator.htmx-request { visibility: visible; }

    /* ---------- список ---------- */

    .list {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .job {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      padding: 16px 20px;
      border-top: 1px solid var(--line);
    }

    .job:first-child { border-top: 0; }

    .job:hover { background: var(--signal-soft); }

    .job-main { min-width: 0; }

    .job-title {
      display: block;
      color: var(--ink);
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;
      text-decoration: none;
    }

    .job-title:hover { color: var(--signal); }

    .job-company {
      display: block;
      margin-top: 2px;
      color: var(--muted);
    }

    .job-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex: none;
      max-width: 40%;
      text-align: right;
      font-size: 13px;
      color: var(--muted);
    }

    .salary {
      color: var(--signal);
      font-size: 15px;
      font-weight: 600;
    }

    .region {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      padding: 48px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty p { margin: 0; }
    .empty p:first-child { color: var(--ink); font-weight: 600; margin-bottom: 4px; }

    .more {
      display: block;
      width: 100%;
      border: 0;
      border-top: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--signal);
      padding: 14px;
    }

    .more:hover { background: var(--signal-soft); }

    /* ---------- подвал ---------- */

    .credit {
      margin: 20px 2px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .credit a {
      color: var(--signal);
      text-decoration: none;
    }

    .credit a:hover { text-decoration: underline; }

    .credit a:focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 2px;
    }

    /* ---------- мобильные ---------- */

    @media (max-width: 680px) {
      .page { padding-top: 32px; }
      .row { grid-template-columns: 1fr 1fr; }
      .row input[name="salary_min"] { grid-column: 1 / -1; }
      .job { flex-direction: column; gap: 6px; }
      .job-side { align-items: flex-start; text-align: left; max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <h1>Career Radar</h1>
      <p class="lede">
        Удалённые вакансии с упоминанием Python. Источник —
        <a href="https://remotive.com" target="_blank" rel="noopener noreferrer">Remotive</a>
      </p>
    </header>

    <form id="filters" class="filters" role="search"
          hx-get="/partials/vacancies"
          hx-target="#results"
          hx-trigger="submit, input delay:400ms"
          hx-indicator="#indicator">

      <input class="search" type="search" name="q"
             aria-label="Поиск по названию и компании"
             placeholder="python senior -junior"
             autocomplete="off">

      <div class="row">
        <input type="text" name="city" aria-label="Регион" placeholder="Регион">
        <input type="text" name="company" aria-label="Компания" placeholder="Компания">
        <input type="number" name="salary_min" aria-label="Зарплата от" placeholder="Зарплата от" min="0">
        <button type="submit">Найти</button>
        <button type="reset" class="ghost"
                hx-get="/partials/vacancies"
                hx-target="#results">Сбросить</button>
      </div>

      <p class="hint">
        <span>Пробел — все слова, <kbd>-слово</kbd> — исключить, <kbd>"фраза"</kbd> — точное совпадение</span>
        <span id="indicator" class="indicator">Ищу…</span>
      </p>
    </form>

    <main id="results" class="list">
      {% include "_vacancies.html" %}
    </main>

    <p class="credit">
      Вакансии предоставлены
      <a href="https://remotive.com" target="_blank" rel="noopener noreferrer">Remotive</a>.
      Полный текст объявления и отклик — на сайте источника.
    </p>
  </div>
</body>
</html>
